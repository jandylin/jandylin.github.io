---
layout: default
---
<main class="content-page">
  <p class="content-page__back"><a href="{{ '/' | relative_url }}">Home</a></p>
  {% if page.collection == 'publications' %}
    {% assign post = page %}
    {% include archive-single-publication.html heading="h1" %}
  {% else %}
    <h1>{{ page.title | escape }}</h1>
  {% endif %}
  <div class="page__content">{{ content }}</div>
</main>
